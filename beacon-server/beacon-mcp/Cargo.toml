[package]
name = "beacon-mcp"
version.workspace = true
edition = "2021"

rust-version.workspace = true
# The whole repository is AGPL-3.0, from the root LICENSE. This crate restates it because it is
# publishable, and a published crate needs the field.
license = "AGPL-3.0-only"
[dependencies]
# `default-features = false` so a `--no-default-features` build of `beacon-server` really drops
# PROJ. Cargo unifies features across the graph, so one default-on path turns it back on.
beacon-core = { path = "../../beacon-db/beacon-core", default-features = false }
rmcp = { version = "=1.8.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
arrow = { workspace = true }
arrow-json = "58"
http = "1"
