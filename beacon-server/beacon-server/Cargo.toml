[package]
name = "beacon-server"
version.workspace = true
edition = "2021"

rust-version.workspace = true
# The whole repository is AGPL-3.0, from the root LICENSE. This crate restates it because it is
# publishable, and a published crate needs the field.
license = "AGPL-3.0-only"
[target.'cfg(not(windows))'.dependencies]
# jemalloc is a production allocator; building its C source costs ~23s. Gate it
# behind a non-default feature so dev/CI builds skip it. Release images enable
# it via `cargo build --release -p beacon-server --features jemalloc` (see Dockerfile).
tikv-jemallocator = {workspace = true, optional = true}
pprof = {workspace = true}

[lib]
name = "beacon_server"
path = "src/lib.rs"

[[bin]]
name = "beacon-server"
path = "src/main.rs"

[features]
jemalloc = ["dep:tikv-jemallocator"]
# The server ships `ST_Transform`, so a standard build links PROJ. The machine needs PROJ 9.6.2 or
# later and pkg-config, as it already needs netCDF and HDF5. `cargo build --no-default-features`
# drops the function and the PROJ dependency with it.
default = ["spatial-proj"]
spatial-proj = ["beacon-core/spatial-proj"]
# The same function, with PROJ built from source. Use it where the distribution carries a PROJ
# older than 9.6.2. See `beacon-functions` for what that build needs.
spatial-proj-bundled = ["beacon-core/spatial-proj-bundled"]

[dependencies]
axum = {workspace = true}
axum-streams = {workspace = true}
tower-http = {workspace = true}
base64 = {workspace = true}

futures = { workspace = true }
bytes = { workspace = true }
arrow-flight = { workspace = true, features = ["flight-sql"] }
arrow-ipc = { workspace = true }

utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-scalar = { workspace = true }
utoipa-swagger-ui = { workspace = true }
tokio = { workspace = true}
tokio-util = { workspace = true}
serde = { workspace = true}
serde_json = { workspace = true}
anyhow = { workspace = true}
arrow = { workspace = true}
arrow-json = "58"
uuid = {workspace = true}
tracing = { workspace = true}
tracing-subscriber = { workspace = true}
tracing-appender = { workspace = true}
tracing-panic = {workspace = true}
tonic = {workspace = true}
prost = {workspace = true}
object_store = { workspace = true }
datafusion = { workspace = true }
thiserror = { workspace = true }
sysinfo = { workspace = true }

# Local dependencies
beacon-server-config = { path = "../beacon-server-config" }
# `default-features = false` so this crate's own `spatial-proj` feature is the one switch that
# turns PROJ on, and `--no-default-features` here reaches all the way down.
beacon-core = { path = "../../beacon-db/beacon-core", default-features = false }
beacon-datafusion-ext = { path = "../../beacon-db/beacon-datafusion-ext" }
beacon-mcp = { path = "../beacon-mcp" }

[dev-dependencies]
# Tests build runtimes directly via `RuntimeBuilder`, so no test-only feature is
# needed.
beacon-core = { path = "../../beacon-db/beacon-core", default-features = false }
# The test harness roots each lake in a temp dir; the library itself never does.
tempfile = { workspace = true }
# `tower::ServiceExt::oneshot` for driving the axum router in the HTTP auth tests.
tower = { version = "0.5", features = ["util"] }
