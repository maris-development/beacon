[workspace]
resolver = "3"
# Atlas is temporarily out of the build. The crate is still on disk; putting it
# back means restoring it to `members` and re-wiring the four sites listed in
# its own Cargo.toml comment.
exclude = ["beacon-db/beacon-file-formats/beacon-arrow-atlas"]
members = ["beacon-server/beacon-server", "beacon-server/beacon-server-config", "beacon-server/beacon-mcp", "beacon-db/beacon-auth", "beacon-db/beacon-common", "beacon-db/beacon-core", "beacon-db/beacon-datafusion-ext", "beacon-db/beacon-db-py", "beacon-db/beacon-file-formats/beacon-arrow-bbf", "beacon-db/beacon-file-formats/beacon-arrow-csv", "beacon-db/beacon-file-formats/beacon-arrow-geoparquet", "beacon-db/beacon-file-formats/beacon-arrow-hdf5", "beacon-db/beacon-file-formats/beacon-arrow-ipc", "beacon-db/beacon-file-formats/beacon-arrow-netcdf", "beacon-db/beacon-file-formats/beacon-arrow-odv", "beacon-db/beacon-file-formats/beacon-arrow-parquet", "beacon-db/beacon-file-formats/beacon-arrow-tiff", "beacon-db/beacon-file-formats/beacon-arrow-zarr", "beacon-db/beacon-file-formats/beacon-binary-format", "beacon-db/beacon-file-formats/beacon-binary-format-toolbox", "beacon-db/beacon-file-formats/beacon-delta", "beacon-db/beacon-file-formats/beacon-iceberg", "beacon-db/beacon-file-formats/beacon-icechunk", "beacon-db/beacon-file-formats/beacon-lance", "beacon-db/beacon-file-formats/beacon-nd-array", "beacon-db/beacon-file-formats/beacon-nd-arrow", "beacon-db/beacon-file-stats", "beacon-db/beacon-functions", "beacon-db/beacon-redb-store", "beacon-db/beacon-sql-databases"]

[workspace.package]

version = "2.0.0-rc.2"

# No workspace-wide `license`. The root LICENSE file (AGPL-3.0) covers the Rust
# crates; only `beacon-server/**` restates it explicitly in its manifests, because
# those are the crates that could plausibly be published. The JS/Python clients under
# `beacon-clients/` are Apache-2.0 and declare that in their own manifests.
# See LICENSING.md.

# Minimum supported Rust version, inherited by every member via `rust-version.workspace = true`.
# This is the "1.94 or later" contract: cargo refuses to build on anything older with a clear
# message naming the version, instead of failing deep in a compile. A `rust-toolchain` file cannot
# express a floor — its channel is one exact version (or `stable`/`beta`/`nightly`) — so the two
# work together: rust-toolchain picks what CI and contributors *use*, this sets what the code
# *requires*. It matters most for source builds from the sdist, which don't ship rust-toolchain.
#
# The floor was 1.91 until the Iceberg reader landed. `iceberg` / `iceberg-datafusion` 0.10 — the
# only release line built against DataFusion 53 and Arrow 58, which this workspace unifies on —
# declares `rust-version = "1.94"`, so the floor follows it. Beacon's own code uses nothing newer
# than 1.91.
rust-version = "1.94"

[workspace.dependencies]
tokio = {version = "1.47.1", features = ["full"]}
tokio-util = {version = "0.7.13", features = ["io"]}
futures = "0.3.31"
futures-util = "0.3.31"
async-trait = "0.1.88"
bytes = "1.10.0"
flume = {version = "0.11.1", features = ["async"]}
parking_lot = {version = "0.12.3", features = ["send_guard", "serde"]}
ordered-float = {version = "5.1.0", features = ["serde"]}
num_cpus = "1.17.0"

utoipa = { version= "=5.3.1", features = ["chrono","preserve_order", "preserve_path_order","rc_schema", "axum_extras"] }
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
utoipa-swagger-ui = { version = "9.0.0", features = ["axum"] }

serde = { version = "^1.0.2", features = ["rc", "derive"] }
serde_json = "1.0.145"
anyhow = "1.0.95"
thiserror = "2.0.12"

tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-appender = "0.2.4"
tracing-test = { version = "0.2.5", features = ["no-env-filter"]}
glob = "0.3.2"
tempfile = "3.15.0"

rusqlite = { version = "0.32.1", features = ["bundled"] }

jsonwebtoken = "9.3.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
typetag = "0.2.19"
indexmap = {version = "2.7.1", features = ["serde"]}
chrono = { version = "0.4.41", features = ["serde"] }
crossbeam = "0.8.4"
moka = {version = "0.12.10", features = ["future", "sync"]}
lru = "0.14.0"
once_cell = "1.21.3"
lazy_static = "1.5.0"
base64 = "0.22"
bloomfilter = { version = "1", features = ["serde"] }
bincode = "1"
# Content addressing for the schema cache. Pinned, and already in `Cargo.lock`
# through other crates, so this adds no new build.
blake3 = "=1.8.6"

redb = "=4.1.0"

memmap2 = "=0.9.10"


deltalake = { version = "=0.32.4", features = ["datafusion"] }
# Apache iceberg-rust. Pinned exactly: the crate carries its own arrow/datafusion floors, and
# 0.10 is the line that matches this workspace (DataFusion 53, Arrow 58). It is also what sets
# the workspace MSRV to 1.94. No storage feature exists — `beacon-iceberg` supplies its own
# `iceberg::io::Storage` over Beacon's object store, so local FS and S3 both work unchanged.
iceberg = "=0.10.0"
iceberg-datafusion = "=0.10.0"
datafusion = "^53"

datafusion-federation = { version = "=0.5.3", features = ["sql"] }

datafusion-table-providers = { version = "=0.11.0", default-features = false }
# PostGIS-named spatial functions on GeoArrow: 117 scalar, 3 aggregate and 2 window. It replaces
# `geodatafusion`, which held a much smaller set. The crate is not on crates.io yet, so the
# reference is a git revision. Pin the revision: a git branch moves, and a moving dependency makes
# a build unrepeatable.
#
# `default-features = false` names the DataFusion major explicitly. `df53` matches the DataFusion
# 53 / Arrow 58 / GeoArrow 0.8 this workspace unifies on. `sql` gives the parser that
# `SessionContext::sql` needs. `proj` stays off; `beacon-functions` offers it as `proj`.
datafusion-spatial = { git = "https://github.com/robinskil/datafusion-spatial.git", rev = "20a416ff473192f47082dd4b3dcf19340aed3c77", default-features = false, features = ["df53", "sql"] }
object_store = { version = "0.13.1", features = ["aws", "gcp", "azure", "http"] }
# Pure-Rust netCDF-4 / classic reader. It parses the HDF5 container itself, so it
# holds no global lock and reads through `object_store` by byte range. The
# netcdf-c bindings do neither. See `beacon-arrow-netcdf`, which offers both.
oxcdf = { git = "https://github.com/robinskil/oxcdf.git", version = "0.3.0", features = ["async", "object-store", "ndarray"] }
# The HDF5 container alone, with no netCDF layer on top. `beacon-arrow-hdf5` uses
# it for the layouts the netCDF data model cannot express, such as a compound
# dataset. Same repository as `oxcdf`, so cargo resolves one revision for both.
oxcdf-hdf5 = { git = "https://github.com/robinskil/oxcdf.git", version = "0.3.0", features = ["async", "object-store"] }
tonic = "0.14.1"


lance = { version = "=7.0.0", default-features = false }
lance-index = "=7.0.0"
lance-io = { version = "=7.0.0", default-features = false }
lance-core = "=7.0.0"
# For LanceFileVersion, which `lance` takes in WriteParams but does not re-export.
lance-encoding = "=7.0.0"

arrow = { version = "^58", features = ["prettyprint"]}
arrow-schema = { version = "^58", features = ["serde"] }
arrow-ipc = { version = "^58", features = ["zstd"] }
arrow-flight = { version = "^58" }
parquet = { version = "^58", features = ["async"] }
geoarrow = "^0.8"
geoarrow-array = "^0.8"
geoarrow-schema = "^0.8"
geoparquet = "^0.8"

arrow-csv = "^58"
async-stream = "0.3.6"
async-tiff = {version = "0.3.0", default-features = false}
async_zip = {version = "0.0.18", features = ["deflate", "tokio", "zstd"]}
axum = {version = "0.8.1", features = ["multipart", "tracing", "ws"]}
axum-streams = {version = "0.25.0", features = ["arrow"]}
bytemuck = {version = "1.25.0", features = ["derive"]}
byteorder = "1.5.0"
cast = "0.3.0"
chacha20poly1305 = "0.10"
csv = "1.3.1"
envconfig = "0.11.0"
# Must stay at the version `datafusion-spatial` uses. Two `geo` versions do not coexist: 0.31 and
# 0.33 need `i_overlay` 4.0 and 4.5, and cargo picks one version per major. Cargo then fails to
# resolve. Read the datafusion-spatial README before you move this line.
geo = "0.33"
geojson = "0.24.2"
gsw = "0.2.2"
hifitime = "4.0.2"
julian = "0.7.1"
lz4_flex = "0.11"
lzzzz = "2.0.0"
ndarray = "0.17.1"
notify = {version = "8.2.0", features = ["flume"]}
num-traits = "0.2.19"
pprof = {version = "0.15", features = ["flamegraph"]}
prost = "0.14.1"
radix_trie = "0.3.0"
regex = "1.11.1"
rkyv = {version = "=0.8.10", features = ["bytes-1", "indexmap-2", "pointer_width_64", "smol_str-0_3"]}
rlimit = "0.11.0"
rmp-serde = "1"
secrecy = "0.10"
smol_str = {version = "0.3.4", features = ["serde"]}
strsim = "0.11.1"
sysinfo = {version = "0.35.2", features = ["serde"]}
tikv-jemallocator = "0.6.0"
tower-http = {version = "0.6.1", features = ["cors", "fs", "trace"]}
tracing-panic = "0.1"
url = "2.5.4"
uuid = "1.16.0"
walkdir = "2.5.0"
# The version `geo` 0.33 and `datafusion-spatial` use. One version keeps the binary small and
# lets a `wkt::Wkt` pass between beacon code and the spatial functions.
wkt = {version = "0.14.0", features = ["geo-types"]}
zarrs = {version = "0.23.12", features = ["async"]}
zarrs_object_store = "0.6.0"
zarrs_storage = "0.4.2"
# `s3` (the AWS SDK backend) is left off: its aws-sdk-* chain requires rustc 1.94,
# above this workspace's 1.91 MSRV. `object-store-s3` reaches S3 through icechunk's
# object-store backend instead, which builds at 1.91 and matches how the rest of
# Beacon talks to object stores.
zarrs_icechunk = { version = "=0.5.1", default-features = false, features = ["object-store-s3", "object-store-gcs", "object-store-azure", "object-store-http", "object-store-fs"] }
zip = {version = "2.2.3", default-features = false, features = ["deflate"]}
zstd = "0.13.2"

# Build profiles tuned for compile time and on-disk footprint. Cargo defaults
# emit full DWARF for the entire graph, which dominated both `target/` size and
# link time. `line-tables-only` keeps usable backtraces; dependencies get no
# debuginfo at all (we never step into them).
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# Tests/benches inherit dev but spell out the dep override so `cargo test`
# artifacts stay small too.
[profile.test.package."*"]
debug = false

[profile.release-wheel]
inherits = "release"
# Drops .symtab/.strtab. The dynamic symbol table the loader needs (.dynsym, 10 KB) is untouched;
# only Rust-side backtrace symbolization inside the extension is lost.
strip = "symbols"
lto = "thin"
codegen-units = 1
