{{- if not .Values.beacon.admin.existingSecret }}
{{- $name := include "beacon.adminSecretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $user := .Values.beacon.admin.adminUsername | default "admin" -}}
{{- /* Preserve an existing generated password across upgrades */ -}}
{{- $pass := .Values.beacon.admin.adminPassword -}}
{{- if not $pass }}
{{-   if and $existing $existing.data (index $existing.data "BEACON_ADMIN_PASSWORD") }}
{{-     $pass = (index $existing.data "BEACON_ADMIN_PASSWORD" | b64dec) }}
{{-   else }}
{{-     $pass = randAlphaNum 24 }}
{{-   end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
type: Opaque
data:
  BEACON_ADMIN_USERNAME: {{ $user | b64enc | quote }}
  BEACON_ADMIN_PASSWORD: {{ $pass | b64enc | quote }}
{{- end }}
