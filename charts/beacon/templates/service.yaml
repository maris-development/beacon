apiVersion: v1
kind: Service
metadata:
  name: {{ include "beacon.fullname" . }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "beacon.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    {{- if .Values.beacon.flightSql.enabled }}
    - name: flight-sql
      port: {{ .Values.service.flightSqlPort }}
      targetPort: flight-sql
      protocol: TCP
    {{- end }}
{{- if eq .Values.kind "StatefulSet" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "beacon.fullname" . }}-headless
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "beacon.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
{{- end }}
