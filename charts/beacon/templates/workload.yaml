{{- include "beacon.validate" . -}}
{{- $isSts := eq .Values.kind "StatefulSet" -}}
{{- $useClaimTemplate := include "beacon.useClaimTemplate" . -}}
apiVersion: apps/v1
kind: {{ .Values.kind }}
metadata:
  name: {{ include "beacon.fullname" . }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if $isSts }}
  serviceName: {{ include "beacon.fullname" . }}-headless
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- else if .Values.updateStrategy }}
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  {{- else if .Values.persistence.enabled }}
  # The old pod must release the volume and the beacon.db lock first.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "beacon.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "beacon.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        # Hash the inputs, not the rendered Secret, so a generated password does not change it.
        checksum/admin-secret: {{ .Values.beacon.admin | toJson | sha256sum }}
        checksum/secrets-key: {{ .Values.beacon.secretsKey | toJson | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "beacon.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: beacon
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.beacon.port }}
              protocol: TCP
            {{- if .Values.beacon.flightSql.enabled }}
            - name: flight-sql
              containerPort: {{ .Values.beacon.flightSql.port }}
              protocol: TCP
            {{- end }}
          env:
            {{- include "beacon.env" . | nindent 12 }}
          {{- with .Values.beacon.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- include "beacon.probe" (dict "probe" .Values.livenessProbe "root" .) | nindent 12 }}
          readinessProbe:
            {{- include "beacon.probe" (dict "probe" .Values.readinessProbe "root" .) | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.beacon.dataDir | quote }}
      {{- if not $useClaimTemplate }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "beacon.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $useClaimTemplate }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
