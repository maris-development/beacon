{{- if and .Values.beacon.s3.enabled (not .Values.beacon.s3.existingSecret) .Values.beacon.s3.accessKeyId }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "beacon.s3SecretName" . }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ .Values.beacon.s3.accessKeyId | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.beacon.s3.secretAccessKey | b64enc | quote }}
{{- end }}
