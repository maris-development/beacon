{{- if and .Values.beacon.secretsKey.value (not .Values.beacon.secretsKey.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "beacon.secretsKeySecretName" . }}
  labels:
    {{- include "beacon.labels" . | nindent 4 }}
type: Opaque
data:
  BEACON_SECRETS_KEY: {{ .Values.beacon.secretsKey.value | b64enc | quote }}
{{- end }}
