# Default values for the Beacon Helm chart.
# These defaults are intentionally GENERIC and deployment-agnostic. Supply a
# site-specific values overlay (e.g. your own ingress host, storage class,
# S3 bucket and resource sizing) rather than editing this file.

# -- Number of Beacon replicas: 1, or 0 to stop it. Beacon takes an exclusive
# lock on its catalog (beacon.db), so a second replica cannot start. The chart
# fails on values above 1.
replicaCount: 1

image:
  repository: ghcr.io/maris-development/beacon
  # Empty uses the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Workload kind. "Deployment" (default) or "StatefulSet". Use StatefulSet
# with persistence.enabled=true for stable per-replica volumes.
kind: Deployment

# -- Deployment `strategy` or StatefulSet `updateStrategy`. When empty, a
# Deployment with persistence uses Recreate: the old pod must release the
# volume and the beacon.db lock before the new pod starts.
updateStrategy: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true

# ---------------------------------------------------------------------------
# Beacon server configuration. Everything here maps to a BEACON_* / AWS_*
# environment variable on the container. Only set what you need; unset keys
# fall back to Beacon's own defaults.
# ---------------------------------------------------------------------------
beacon:
  # HTTP API + admin UI
  port: 5001
  host: "0.0.0.0"
  # URL prefix for all routes, e.g. "/beacon". Empty serves at "/".
  basePath: ""
  logLevel: "info"           # trace|debug|info|warn|error|off
  # Root data directory inside the container. datasets/ and tables/ derive
  # from this unless overridden by Beacon.
  dataDir: "/beacon/data"

  # Admin credentials. By default a Secret is created from adminUsername /
  # adminPassword below. For production, set existingSecret to a Secret that
  # provides BEACON_ADMIN_USERNAME and BEACON_ADMIN_PASSWORD and leave the
  # inline values empty.
  # With GitOps tools (Argo CD, Flux) or `helm template`, set adminPassword or
  # existingSecret. The chart cannot read the cluster there, so it generates
  # a new random password on every render.
  admin:
    adminUsername: "admin"
    adminPassword: ""        # if empty and existingSecret unset, a random one is generated
    existingSecret: ""       # name of a Secret with BEACON_ADMIN_USERNAME/PASSWORD keys

  # Master key (BEACON_SECRETS_KEY) that encrypts stored credentials of external
  # SQL database tables. Without it, Beacon rejects a database table with a
  # password. It must be 32 bytes in base64 (`openssl rand -base64 32`).
  # Keep it stable: a changed or lost key makes stored credentials unreadable.
  secretsKey:
    value: ""                # creates a Secret; prefer existingSecret
    existingSecret: ""       # name of a Secret that holds the key
    existingSecretKey: ""    # key in that Secret; empty uses BEACON_SECRETS_KEY

  # Arrow Flight SQL endpoint
  flightSql:
    enabled: true
    port: 32011
    host: "0.0.0.0"
    allowAnonymous: false

  # Runtime tuning (optional). Leave null to use Beacon defaults.
  workerThreads: null
  apiThreads: null
  batchSize: null
  maxUploadBytes: null
  vmMemorySize: null

  # Background crawler / file-stats (optional)
  crawler:
    enabled: null            # BEACON_CRAWLER_ENABLE
    defaultIntervalSecs: null
  fileStats:
    enabled: null            # BEACON_FILE_STATS_ENABLE

  # Function plugins (optional). Both are comma lists.
  # Allowed remote source prefixes, e.g. "github:maris-development/". Empty allows only file://.
  pluginSources: ""          # BEACON_PLUGIN_SOURCES
  # Plugins to install at startup, as name=source, e.g. "demo=github:maris-development/demo@v1".
  plugins: ""                # BEACON_PLUGINS

  # CORS (optional). Only set if the admin UI / API is called cross-origin.
  cors:
    allowedOrigins: null
    allowedMethods: null
    allowedHeaders: null

  # OIDC auth (optional). Enable to delegate auth to an OIDC provider.
  oidc:
    enabled: false
    issuer: ""
    audience: ""
    jwksUrl: ""
    rolesClaim: ""
    usernameClaim: ""

  # Back the datasets store with an S3-compatible bucket instead of a local
  # volume. Credentials use the standard AWS chain (IRSA / Pod Identity /
  # env / instance profile). Prefer IRSA or Pod Identity over static keys.
  s3:
    enabled: false
    bucket: ""
    region: ""
    endpoint: ""             # set for S3-compatible stores (e.g. MinIO)
    # The server default is true. Set true for an http:// endpoint such as a local MinIO.
    allowHttp: false
    virtualHostedStyle: false
    # Static credentials (NOT recommended — prefer IRSA/Pod Identity).
    # If set, a Secret is created exposing AWS_ACCESS_KEY_ID/SECRET_ACCESS_KEY.
    accessKeyId: ""
    secretAccessKey: ""
    existingSecret: ""       # Secret providing AWS_* keys instead of the above

  # Free-form extra environment variables (list of name/value or name/valueFrom).
  extraEnv: []
  # Mount extra config via envFrom (ConfigMaps / Secrets you manage yourself).
  extraEnvFrom: []

# ---------------------------------------------------------------------------
# Persistence for the local data directory (datasets + tables / beacon.db).
# When beacon.s3.enabled=true the datasets live in S3, but `tables` (the
# catalog) is still local and should be persisted.
# ---------------------------------------------------------------------------
persistence:
  enabled: true
  # Existing PVC name to reuse instead of creating one.
  existingClaim: ""
  storageClass: ""           # "" uses the cluster default
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  annotations: {}

service:
  type: ClusterIP
  httpPort: 5001
  flightSqlPort: 32011
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: beacon.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
  # limits:
  #   cpu: "4"
  #   memory: 8Gi
  # requests:
  #   cpu: "1"
  #   memory: 2Gi

# An empty httpGet.path checks {beacon.basePath}/api/health.
livenessProbe:
  httpGet:
    path: ""
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: ""
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 6

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
