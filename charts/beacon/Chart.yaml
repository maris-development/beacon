apiVersion: v2
name: beacon
description: A Helm chart to deploy the Beacon data lake query engine on Kubernetes.
type: application
# Chart version — bump on chart changes (SemVer).
version: 0.1.0
# The Beacon server version this chart defaults to (see values.yaml image.tag).
appVersion: "latest"
home: https://maris-development.github.io/beacon/
sources:
  - https://github.com/maris-development/beacon
keywords:
  - beacon
