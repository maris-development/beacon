  - datafusion
  - data-lake
  - query-engine
  - netcdf
  - zarr
  - parquet
  - arrow-flight-sql
maintainers:
  - name: Beacon community
    url: https://github.com/maris-development/beacon
icon: https://raw.githubusercontent.com/maris-development/beacon/main/docs/public/beacon-logo-small.png
