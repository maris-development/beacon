[package]
name = "beacon-datafusion-ext"
version.workspace = true
edition = "2024"

rust-version.workspace = true
[dependencies]
beacon-file-stats = { path = "../beacon-file-stats", features = ["datafusion"] }
# Fingerprints a format's options for the schema cache. A fixed algorithm, so a
# stored entry keeps its meaning across releases.
blake3 = { workspace = true }
datafusion = { workspace = true }
datafusion-federation = { workspace = true }
chrono = { workspace = true }
arrow-flight = { workspace = true, features = ["flight-sql"] }
tonic = { workspace = true }
# Encodes remote-Beacon HTTP Basic credentials (`authorization: Basic <base64(user:pass)>`).
base64 = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
typetag =  { workspace=true}
anyhow = { workspace = true }
arrow = { workspace = true }
# `arrow` re-exports `arrow-schema`; enabling its `serde` feature here makes
# `arrow::datatypes::Schema` (de)serializable for this crate's persisted table
# definitions (`table_ext.rs`) even when built standalone (`-p`), not only when
# the feature is unified across a full workspace build.
arrow-schema = { workspace = true, features = ["serde"] }
ordered-float = { workspace = true }
indexmap = { workspace = true }
moka = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
object_store = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = {workspace = true}
glob = {workspace = true}

# Rebuilding a folded geometry constant as an `ST_GeomFromText` call before a federated
# sub-plan is unparsed. See `remote/geometry_sql.rs`.
datafusion-spatial = { workspace = true }
geoarrow-array = { workspace = true }
geoarrow-schema = { workspace = true }

beacon-common = { path = "../beacon-common" }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
chrono = { workspace = true }
