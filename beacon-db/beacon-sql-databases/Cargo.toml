[package]
name = "beacon-sql-databases"
version.workspace = true
edition = "2021"

rust-version.workspace = true
[features]
# Each engine is opt-in. An engine feature turns on the matching
# `<engine>-federation` feature in datafusion-table-providers so scans push
# filters/projections/aggregations down to the source database.
default = ["postgres", "mysql"]
postgres = ["datafusion-table-providers/postgres-federation"]
mysql = ["datafusion-table-providers/mysql-federation"]
# ODBC — reaches SQL Server (and any ODBC source) via a connection string. NOT default: it
# links `odbc-api`/`arrow-odbc`, which need a system ODBC driver manager (unixODBC) at build and
# a vendor driver (e.g. msodbcsql18) at runtime — so it is opt-in.
odbc = ["datafusion-table-providers/odbc-federation", "dep:arrow-odbc", "dep:odbc-api"]

[dependencies]
beacon-datafusion-ext = { path = "../beacon-datafusion-ext" }

datafusion = { workspace = true }
datafusion-federation = { workspace = true }
datafusion-table-providers = { workspace = true }
arrow = { workspace = true }

# Version-pins only (enabled with the `odbc` feature). They prevent a resolution conflict in the
# ODBC path of `datafusion-table-providers 0.12`. It asks for `arrow-odbc "25.2"` and
# `odbc-api "28.2"`. Without a pin, `arrow-odbc` resolves to 25.3.0, which allows `odbc-api` 29.
# The resolver then adds a second, incompatible `odbc-api` that breaks the ODBC module of dtp.
# `arrow-odbc =25.2.0` keeps `odbc-api` below 29, and `odbc-api =28.2.0` pins the single instance.
# Beacon does not use either crate directly.
arrow-odbc = { version = "=25.2.0", optional = true }
odbc-api = { version = "=28.2.0", optional = true }

async-trait = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
typetag = { workspace = true }
secrecy = {workspace = true}
# XChaCha20-Poly1305 AEAD for encrypting persisted DB credentials at rest.
# `getrandom` (default) provides OsRng for nonce generation.
chacha20poly1305 = {workspace = true}
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
