[build-system]
requires = [
    # >=1.8.4 is the release that installs a Rust toolchain into a temp dir when `cargo` is
    # missing, which a source build (sdist on a platform with no wheel) relies on.
    "maturin>=1.8.4,<2.0",
    # `prost-build` (reached through Lance) needs protoc at build time and does not bundle one.
    # pip installs this into the isolated build environment and puts that environment's scripts
    # directory on PATH, so prost-build finds it like a system install. Pinned to one protoc major
    # so a protobuf release cannot silently change the compiler used.
    #
    # Gated on architecture: wheels exist for x86_64/aarch64/arm64/AMD64 (manylinux, musllinux,
    # macOS, Windows) but not for e.g. ppc64le or s390x. Requiring it unconditionally would break
    # source builds on those even where a perfectly good system protoc is installed; there, this
    # is skipped and the system one is used.
    "protoc-wheel-0>=30,<31; platform_machine == 'x86_64' or platform_machine == 'aarch64' or platform_machine == 'arm64' or platform_machine == 'AMD64'",
]
build-backend = "maturin"

[project]
name = "beacondb"
version = "2.0.0rc4"
description = "An embeddable, in-process analytical database for scientific data."
readme = "README.md"
requires-python = ">=3.10"
# AGPL-3.0, like the engine the wheel holds. `beacon-core` links the BBF submodule, which is
# AGPL-3.0, so the wheel can carry no other licence. The text is the root `LICENSE` of the
# repository, which is not copied here, so this field and the classifier below are what the
# wheel states. See LICENSING.md.
license = { text = "AGPL-3.0" }
authors = [{ name = "Beacon" }]
keywords = ["beacon", "database", "sql", "arrow", "embedded", "olap", "analytics", "netcdf", "zarr", "parquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering",
]
# No required runtime dependencies: results cross into Python over the Arrow
# PyCapsule protocol, so pyarrow/pandas/polars are only needed by the methods
# that explicitly return their types.
dependencies = []

[project.optional-dependencies]
arrow = ["pyarrow>=14.0"]
pandas = ["pyarrow>=14.0", "pandas>=2.0"]
polars = ["polars>=1.0"]
sqlalchemy = ["sqlalchemy>=2.0"]
# Every optional runtime integration in one install: `pip install "beacondb[all]"`.
# Written as a self-referential extra (PEP 508 recursive extras) rather than a copied dependency
# list, so adding an extra above cannot leave this one silently behind. `dev` is deliberately not
# included — pytest/ruff/h5py are our test tooling, not something a user of the library wants.
all = ["beacondb[arrow,pandas,polars,sqlalchemy]"]
dev = ["pytest>=8.0", "pyarrow>=14.0", "pandas>=2.0", "polars>=1.0", "h5py>=3.0", "sqlalchemy>=2.0", "ruff>=0.6"]

# Registers the `beacondb://` dialect so `create_engine("beacondb:///...")` works with no manual
# setup once the package is installed.
[project.entry-points."sqlalchemy.dialects"]
beacondb = "beacondb.sqlalchemy:BeacondbDialect"

[project.urls]
Homepage = "https://github.com/maris-development/beacon"
Repository = "https://github.com/maris-development/beacon"
Source = "https://github.com/maris-development/beacon/tree/main/beacon-db/beacon-db-py"

[tool.maturin]
# Mixed Rust/Python layout: hand-written Python in python/beacondb, the compiled
# extension dropped in beside it as `beacondb._beacondb`.
python-source = "python"
module-name = "beacondb._beacondb"
features = ["pyo3/extension-module"]
# Never ship compiled bytecode: the wheel is abi3 (one wheel for many CPythons), so a
# version-specific `.pyc` baked in from a local build is both wrong and stale.
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
