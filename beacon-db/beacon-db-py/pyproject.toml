[build-system]
requires = [
    # Release 1.8.4 and later install a Rust toolchain in a temporary directory when `cargo` is
    # absent. A source build needs that. pip makes a source build where no wheel exists.
    "maturin>=1.8.4,<2.0",
    # `prost-build`, through Lance, needs protoc and holds none. pip installs this wheel in the
    # build environment, and prost-build finds it there. The pin holds one major version.
    # The marker skips an architecture with no wheel, such as ppc64le. Those use a system protoc.
    "protoc-wheel-0>=30,<31; platform_machine == 'x86_64' or platform_machine == 'aarch64' or platform_machine == 'arm64' or platform_machine == 'AMD64'",
]
build-backend = "maturin"

[project]
name = "beacondb"
version = "2.0.0rc5"
description = "An embeddable, in-process analytical database for scientific data."
readme = "README.md"
requires-python = ">=3.10"
# The licence is AGPL-3.0, as the engine in the wheel is. `beacon-core` links the AGPL-3.0 BBF
# submodule. The root `LICENSE` of the repository holds the text, and no copy is here.
# This field and the classifier below state the licence in the wheel.
license = { text = "AGPL-3.0" }
authors = [{ name = "Beacon" }]
keywords = ["beacon", "database", "sql", "arrow", "embedded", "olap", "analytics", "netcdf", "zarr", "parquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering",
]
# The package needs no runtime dependency. A result crosses into Python over the Arrow PyCapsule
# protocol. Only the methods that return a pyarrow, pandas or polars type need those packages.
dependencies = []

[project.optional-dependencies]
arrow = ["pyarrow>=14.0"]
pandas = ["pyarrow>=14.0", "pandas>=2.0"]
polars = ["polars>=1.0"]
sqlalchemy = ["sqlalchemy>=2.0"]
# One command installs every optional integration: `pip install "beacondb[all]"`. This extra
# names the extras above, and holds no copy of their lists. A new extra therefore stays correct
# here. `dev` stays out. pytest, ruff and h5py test the package. A user needs none of them.
all = ["beacondb[arrow,pandas,polars,sqlalchemy]"]
dev = ["pytest>=8.0", "pyarrow>=14.0", "pandas>=2.0", "polars>=1.0", "h5py>=3.0", "sqlalchemy>=2.0", "ruff>=0.6"]

# This entry point registers the `beacondb://` dialect. `create_engine("beacondb:///...")` then
# works after the install, with no other step.
[project.entry-points."sqlalchemy.dialects"]
beacondb = "beacondb.sqlalchemy:BeacondbDialect"

[project.urls]
Homepage = "https://github.com/maris-development/beacon"
Repository = "https://github.com/maris-development/beacon"
Source = "https://github.com/maris-development/beacon/tree/main/beacon-db/beacon-db-py"

[tool.maturin]
# The layout holds Rust and Python. The Python code is in python/beacondb. The build puts the
# compiled module beside it, as `beacondb._beacondb`.
python-source = "python"
module-name = "beacondb._beacondb"
features = ["pyo3/extension-module"]
# The wheel holds no compiled bytecode. The wheel is abi3, and serves many CPython versions.
# A `.pyc` file from a local build is therefore wrong, and old as well.
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
