[package]
name = "beacon-arrow-hdf5"
version.workspace = true
edition = "2021"

rust-version.workspace = true

[dependencies]
arrow = { workspace = true }
datafusion = { workspace = true }
object_store = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
ndarray = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }

# The pure-Rust read path. `oxcdf` walks the container and applies the HDF5
# dimension-scale and netCDF conventions; `oxcdf-hdf5` is the container alone,
# used here for the datatypes those conventions do not model (a compound
# dataset). Both come from one repository, so this adds no new third party.
oxcdf = { workspace = true }
oxcdf-hdf5 = { workspace = true }

# Every write path, and the conversion code of the reader. A NetCDF-4 file is HDF5. This crate owns
# the HDF5 identity (names, `.h5`/`.hdf5` extensions, `STORED AS {h5,hdf5}`, `read_hdf5`).
beacon-arrow-netcdf = { path = "../beacon-arrow-netcdf" }
beacon-datafusion-ext = { path = "../../beacon-datafusion-ext" }
beacon-nd-execution = { path = "../../beacon-nd-execution" }
beacon-nd-array = { path = "../beacon-nd-array" }
beacon-common = { path = "../../beacon-common" }

[dev-dependencies]
tempfile = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
