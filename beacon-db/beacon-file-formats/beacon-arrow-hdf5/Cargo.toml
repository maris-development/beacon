[package]
name = "beacon-arrow-hdf5"
version.workspace = true
edition = "2021"

rust-version.workspace = true
[features]
# Build netCDF-c and HDF5 from source and link them statically. Forwarded to
# `beacon-arrow-netcdf` (the reader this crate delegates to by default); off by default. Used for
# the portable Python wheels.
static = ["beacon-arrow-netcdf/static"]

[dependencies]
arrow = { workspace = true }
datafusion = { workspace = true }
object_store = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
moka = { workspace = true }
ndarray = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }

# The pure-Rust read path. `oxcdf` walks the container and applies the HDF5
# dimension-scale and netCDF conventions; `oxcdf-hdf5` is the container alone,
# used here for the datatypes those conventions do not model (a compound
# dataset). Both come from one repository, so this adds no new third party.
oxcdf = { workspace = true }
oxcdf-hdf5 = { workspace = true }

# The default read path, and every write path. A NetCDF-4 file *is* HDF5, and netCDF-c's HDF5
# dispatch also opens plain HDF5 files. So this crate owns the HDF5 *identity* (names, `.h5`/`.hdf5`
# extensions, `STORED AS {h5,hdf5}`, `read_hdf5`) and delegates to beacon-arrow-netcdf unless the
# Rust reader is turned on.
beacon-arrow-netcdf = { path = "../beacon-arrow-netcdf" }
beacon-datafusion-ext = { path = "../../beacon-datafusion-ext" }
beacon-nd-array = { path = "../beacon-nd-array" }
beacon-common = { path = "../../beacon-common" }

[dev-dependencies]
tempfile = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
