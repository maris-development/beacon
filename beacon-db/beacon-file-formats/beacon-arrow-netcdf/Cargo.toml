[package]
name = "beacon-arrow-netcdf"
version = "2.0.0-rc.1"
edition = "2021"

rust-version.workspace = true
[features]
# Build netCDF-c and HDF5 from source and link them statically, instead of linking the system
# libraries. Off by default (dynamic linking is faster to build and fine for local dev / the
# server, which control their own environment); turned on for the distributable Python wheels so
# they carry netCDF/HDF5 and need nothing installed — the only way to build a portable Windows
# wheel. Requires `cmake` at build time (netcdf-src/hdf5-src build with it).
static = ["netcdf/static", "netcdf-sys/static"]

[dependencies]
netcdf = { git ="https://github.com/robinskil/netcdf.git", features = ["ndarray"], version = "0.11.1"}
netcdf-sys = { git ="https://github.com/robinskil/netcdf.git", package = "netcdf-sys" }
arrow = { workspace = true }

anyhow = { workspace=true }
tempfile = { workspace=true}
tokio = { workspace=true }
futures = { workspace=true }
indexmap = { workspace=true }
async-trait = { workspace=true }
ndarray = "0.17"
ordered-float = { workspace = true }
num-traits = {workspace = true}
hifitime = {workspace = true}
bytemuck = {workspace = true}
julian = {workspace = true}
tracing = { workspace = true }
serde = { workspace = true }
object_store = { workspace = true }
datafusion = { workspace = true }
moka = { workspace = true }
chrono = { workspace = true }


beacon-datafusion-ext = { path = "../../beacon-datafusion-ext" }
beacon-nd-array = { path = "../beacon-nd-array" }
beacon-common = { path = "../../beacon-common" }

[dev-dependencies]
tokio = { workspace = true }
