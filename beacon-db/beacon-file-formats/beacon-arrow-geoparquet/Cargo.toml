[package]
name = "beacon-arrow-geoparquet"
version.workspace = true
edition = "2024"

rust-version.workspace = true
[dependencies]
tokio = { workspace = true }
arrow = { workspace = true }
datafusion = { workspace = true }
datafusion-datasource = { workspace = true }
datafusion-datasource-parquet = { workspace = true }
object_store = { workspace = true }
parquet = { workspace = true }
geoarrow = { workspace = true }
geoarrow-array = { workspace = true }
geoarrow-schema = { workspace = true }
geoparquet = { workspace = true, features = ["async"] }
datafusion-spatial-kernels = { workspace = true }
geo = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }

beacon-common = { path = "../../beacon-common" }
beacon-datafusion-ext = { path = "../../beacon-datafusion-ext" }

[dev-dependencies]
# The spatial UDFs, to build the predicates the box reader has to recognise.
# A test dependency only: the format itself reads the box out of any expression
# tree, and never registers or calls a function.
datafusion-spatial = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
