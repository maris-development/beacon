[package]
name = "beacon-core"
version.workspace = true
edition = "2021"

rust-version.workspace = true
[features]
# Statically build+link netCDF/HDF5 (see beacon-arrow-netcdf). Passed through for the Python
# wheels; off by default.
static-netcdf = ["beacon-arrow-netcdf/static", "beacon-arrow-hdf5/static"]
# Enable the ODBC external-table engine (`STORED AS ODBC`), reaching SQL Server and any ODBC
# source. Off by default: it needs a system ODBC driver manager (unixODBC) at build time and a
# vendor driver (e.g. msodbcsql18) at runtime. PostgreSQL/MySQL are always on via the crate's
# defaults.
sql-odbc = ["beacon-sql-databases/odbc"]

[dependencies]
futures = { workspace=true}
anyhow = { workspace=true}
tempfile = { workspace=true}
serde = { workspace=true}
serde_json = { workspace=true}
utoipa = { workspace=true}
async-trait = { workspace=true }
datafusion = { workspace=true }
datafusion-federation = { workspace=true }
geodatafusion = { workspace=true }
arrow = { workspace=true}
tokio = { workspace = true }
object_store = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
async-stream = {workspace = true}
parking_lot = { workspace = true}
sysinfo = {workspace = true}
uuid = {workspace = true}
chrono = { workspace = true }
cast = {workspace = true}
geojson = {workspace = true}
num_cpus = {workspace = true}
url = { workspace = true }
typetag = { workspace = true }
# Reads the plaintext out of a decrypted `EncryptedSecret` (a `secrecy::SecretString`).
secrecy = { workspace = true }
# Decodes the base64 `BEACON_SECRETS_KEY` master key.
base64 = { workspace = true }

tracing = { workspace=true}
# Local dependencies
beacon-auth = { path = "../beacon-auth" }
beacon-common = { path = "../beacon-common" }
beacon-arrow-netcdf = { path = "../beacon-file-formats/beacon-arrow-netcdf" }
beacon-arrow-hdf5 = { path = "../beacon-file-formats/beacon-arrow-hdf5" }
beacon-arrow-odv = { path = "../beacon-file-formats/beacon-arrow-odv" }
beacon-arrow-tiff = { path = "../beacon-file-formats/beacon-arrow-tiff" }
beacon-functions = { path = "../beacon-functions" }
beacon-arrow-ipc = { path = "../beacon-file-formats/beacon-arrow-ipc" }
beacon-arrow-csv = { path = "../beacon-file-formats/beacon-arrow-csv" }
beacon-arrow-parquet = { path = "../beacon-file-formats/beacon-arrow-parquet" }
beacon-arrow-geoparquet = { path = "../beacon-file-formats/beacon-arrow-geoparquet" }
beacon-arrow-bbf = { path = "../beacon-file-formats/beacon-arrow-bbf" }
beacon-arrow-zarr = { path = "../beacon-file-formats/beacon-arrow-zarr" }
beacon-arrow-atlas = { path = "../beacon-file-formats/beacon-arrow-atlas" }
beacon-datafusion-ext = { path = "../beacon-datafusion-ext" }
beacon-lance = { path = "../beacon-file-formats/beacon-lance" }
beacon-delta = { path = "../beacon-file-formats/beacon-delta" }
beacon-sql-databases = { path = "../beacon-sql-databases" }
beacon-redb-store = { path = "../beacon-redb-store" }
beacon-file-stats = { path = "../beacon-file-stats", features = ["datafusion"] }

[dev-dependencies]
deltalake = { workspace = true }
