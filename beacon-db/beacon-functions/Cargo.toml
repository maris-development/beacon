[package]
name = "beacon-functions"
version.workspace = true
edition = "2021"

rust-version.workspace = true

[features]
# PROJ is on by default, so a standard build ships `ST_Transform` — the one spatial function that
# reprojects coordinates. It links PROJ, a C++ library, so the machine needs PROJ 9.6.2 or later
# and pkg-config. That puts PROJ beside netCDF and HDF5: a native library the build requires.
#
# `--no-default-features` drops the function and the native dependency with it. The build then
# needs no PROJ at all, and every other spatial function stays.
default = ["proj"]
proj = ["datafusion-spatial/proj"]
# Build PROJ from source instead of linking the one on the machine. Use it where the distribution
# carries a PROJ older than 9.6.2. It needs a C++ toolchain, CMake, sqlite3 and libtiff, and the
# program then needs `PROJ_DATA` to point at the `share/proj` directory it produces.
proj-bundled = ["datafusion-spatial/proj-bundled"]

[dependencies]
async-stream = { workspace = true }
async-trait = { workspace = true }
datafusion = {workspace = true}
arrow = {workspace = true}
strsim = {workspace = true}
serde = { workspace = true}
serde_json = { workspace = true}
csv = {workspace = true}
object_store = { workspace = true }
once_cell = { workspace = true }

lazy_static = {workspace = true}
gsw = {workspace = true}
lru = {workspace = true}
tracing = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }

beacon-common = { path = "../beacon-common" }
beacon-arrow-odv = { path = "../beacon-file-formats/beacon-arrow-odv" }
beacon-arrow-netcdf = { path = "../beacon-file-formats/beacon-arrow-netcdf" }
beacon-arrow-hdf5 = { path = "../beacon-file-formats/beacon-arrow-hdf5" }
beacon-arrow-tiff = { path = "../beacon-file-formats/beacon-arrow-tiff" }
beacon-delta = { path = "../beacon-file-formats/beacon-delta" }
beacon-iceberg = { path = "../beacon-file-formats/beacon-iceberg" }
beacon-icechunk = { path = "../beacon-file-formats/beacon-icechunk" }
beacon-arrow-zarr = { path = "../beacon-file-formats/beacon-arrow-zarr" }
beacon-arrow-ipc = { path = "../beacon-file-formats/beacon-arrow-ipc" }
beacon-arrow-csv = { path = "../beacon-file-formats/beacon-arrow-csv" }
beacon-arrow-parquet = { path = "../beacon-file-formats/beacon-arrow-parquet" }
beacon-arrow-geoparquet = { path = "../beacon-file-formats/beacon-arrow-geoparquet" }
beacon-arrow-bbf = { path = "../beacon-file-formats/beacon-arrow-bbf" }
beacon-datafusion-ext = { path = "../beacon-datafusion-ext" }
datafusion-spatial = { workspace=true }
