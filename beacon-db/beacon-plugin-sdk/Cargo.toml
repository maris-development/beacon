[package]
name = "beacon-plugin-sdk"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "SDK for Beacon native function plugins"
readme = "README.md"
license = "AGPL-3.0-only"
repository = "https://github.com/maris-development/beacon"
keywords = ["beacon", "datafusion", "plugin", "udf", "sql"]
categories = ["database", "development-tools"]

# A native plugin depends only on this crate, so its DataFusion versions match Beacon.
[dependencies]
datafusion = { workspace = true }
datafusion-ffi = { workspace = true }
datafusion-proto = { workspace = true }
datafusion-proto-common = { workspace = true }
prost = { workspace = true }
beacon-nd-encoding = { path = "../beacon-nd-encoding" }
stabby = { workspace = true }
# Re-exported to plugins: keep the default and cloud features off.
object_store = { version = "0.13.1", default-features = false }
async-ffi = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tokio = { version = "1.47.1", default-features = false, features = ["rt", "rt-multi-thread", "sync"] }
chrono = { version = "0.4.41", default-features = false }
form_urlencoded = "1.2.2"
tracing = { workspace = true }

[dev-dependencies]
object_store = { version = "0.13.1", default-features = false, features = ["fs"] }
tokio = { version = "1.47.1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
tempfile = { workspace = true }
