[package]
name = "beacon-plugin-sdk"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "SDK for Beacon native function plugins"
readme = "README.md"
license = "AGPL-3.0-only"
repository = "https://github.com/maris-development/beacon"
keywords = ["beacon", "datafusion", "plugin", "udf", "sql"]
categories = ["database", "development-tools"]

# A native plugin depends only on this crate, so its DataFusion versions match Beacon.
[dependencies]
datafusion = { workspace = true }
datafusion-ffi = { workspace = true }
datafusion-proto = { workspace = true }
stabby = { workspace = true }
object_store = { workspace = true }
async-ffi = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
chrono = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
