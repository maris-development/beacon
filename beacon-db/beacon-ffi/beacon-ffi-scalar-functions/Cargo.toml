[package]
name = "beacon-ffi-scalar-functions"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Scalar function plugins of Beacon: the builder, the planner hooks and their FFI tables"
license = "AGPL-3.0-only"
repository = "https://github.com/maris-development/beacon"

[dependencies]
beacon-ffi-abi = { path = "../beacon-ffi-abi" }
datafusion = { workspace = true }
datafusion-ffi = { workspace = true }
datafusion-proto = { workspace = true }
stabby = { workspace = true }

[dev-dependencies]
tokio = { version = "1.47.1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
