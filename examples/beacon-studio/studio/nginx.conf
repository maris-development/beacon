server {
    listen 80;
    root /usr/share/nginx/html;

    # Send each unknown path to index.html, so the client routes work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The build gives the files under _app a content hash in the name.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
