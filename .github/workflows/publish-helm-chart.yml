name: Publish Helm chart

# Chart version and appVersion equal the image's type=semver tag, so chart 2.0.2 deploys beacon:2.0.2.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Chart version and appVersion, for example 2.0.2. A leading "v" is removed.
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  CHART_DIR: charts/beacon
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  publish:
    name: Package and push
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          RAW: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          version="${RAW#v}"
          # SemVer without build metadata: appVersion becomes an image tag and a label, which reject "+".
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::'$RAW' is not a SemVer version without build metadata (expected e.g. v2.0.2 or 2.1.0-rc1)."
            exit 1
          fi
          echo "Chart version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Tag pushes only: a manual run can publish a chart for an older server release.
      - name: Verify version
        if: github.event_name == 'push'
        run: |
          python3 -m pip install --quiet --upgrade packaging
          python3 scripts/check-version.py "${{ github.ref_name }}"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint chart
        run: helm lint "$CHART_DIR" --strict

      - name: Package chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          helm package "$CHART_DIR" --version "$VERSION" --app-version "$VERSION" --destination dist

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: helm push "dist/beacon-${VERSION}.tgz" "$CHART_REPO"

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "Published \`${CHART_REPO}/beacon:${VERSION}\`."
            echo
            echo '```bash'
            echo "helm install beacon ${CHART_REPO}/beacon --version ${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
