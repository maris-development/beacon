name: Publish beacon-datalake-cli

# Publishes the `beacon-datalake-cli` Python package to PyPI.
#
# Release candidates: a pre-release tag (v2.0.0-rc.1) publishes as PyPI version 2.0.0rc1 — PyPI
# normalizes the SemVer suffix to PEP 440. No dist-tag equivalent is needed: pip ignores
# pre-releases unless asked, so `pip install beacon-datalake-cli` stays on the last stable release
# and RC users opt in with `pip install --pre beacon-datalake-cli`.

on:
  push:
    tags:
      # Covers stable (v1.8.0) and pre-release (v2.0.0-rc.1) tags alike.
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Expected version, cross-checked against pyproject.toml. Empty = publish what it declares."
        required: false
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    working-directory: beacon-clients/beacon-datalake-cli

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (with dev tools)
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Verify version
        shell: bash
        env:
          # On a tag push the tag is the expected version; on a manual run the (optional) input is.
          # Empty means "no assertion" — publish whatever the manifests declare.
          EXPECTED: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          python3 -m pip install --quiet --upgrade packaging
          python3 "$GITHUB_WORKSPACE/scripts/check-version.py" "$EXPECTED"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: beacon-datalake-cli-dist
          path: beacon-clients/beacon-datalake-cli/dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/beacon-datalake-cli
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: beacon-datalake-cli-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # A release tag may fire this more than once (e.g. a re-run) — don't
          # fail if that exact version is already on PyPI.
          skip-existing: true
