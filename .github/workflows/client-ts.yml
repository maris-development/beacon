name: TypeScript client

on:
  push:
    branches: [main]
    paths:
      - "beacon-clients/beacon-ts/**"
      - ".github/workflows/client-ts.yml"
  pull_request:
    paths:
      - "beacon-clients/beacon-ts/**"
      - ".github/workflows/client-ts.yml"
  workflow_dispatch:

# A new push to a PR stops the old run. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: beacon-clients/beacon-ts

jobs:
  build:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
