name: Publish beacon-ts

# Publishes the `@beacon/client` TypeScript package to npm.
#
# Release candidates: a pre-release tag (v2.0.0-rc.1) publishes under a matching npm dist-tag
# (`rc`) rather than `latest`, so `npm i @beacon/client` keeps resolving to the last stable
# release and RC users opt in with `npm i @beacon/client@rc`.

on:
  push:
    tags:
      # Covers stable (v1.8.0) and pre-release (v2.0.0-rc.1) tags alike.
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Expected version, cross-checked against package.json. Empty = publish what it declares."
        required: false
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    working-directory: beacon-datalake-clients/beacon-ts

jobs:
  publish:
    name: Test, build, and publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@beacon/client
    permissions:
      contents: read
      id-token: write # provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify version
        env:
          # On a tag push the tag is the expected version; on a manual run the (optional) input is.
          # Empty means "no assertion" — publish whatever the manifests declare.
          EXPECTED: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          python3 -m pip install --quiet --upgrade packaging
          python3 "$GITHUB_WORKSPACE/scripts/check-version.py" "$EXPECTED"

      - name: Derive npm dist-tag
        id: version
        run: |
          # `npm publish` with no --tag defaults to `latest`, which would make an RC the default
          # install for everyone. Derive it from the SemVer pre-release identifier instead:
          # 2.0.0-rc.1 -> rc, 2.0.0-beta.2 -> beta, 1.8.0 -> latest.
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*)
              pre="${version#*-}"                        # 2.0.0-rc.1 -> rc.1
              pre="${pre%%.*}"                           # rc.1       -> rc
              pre="${pre%%[0-9]*}"                       # rc1        -> rc
              npm_tag="${pre:-next}"                     # numeric-only pre-release (2.0.0-1) -> next
              ;;
            *) npm_tag="latest" ;;
          esac
          echo "publishing $version under npm dist-tag: $npm_tag"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
