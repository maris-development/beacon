name: Publish beacon-ts

# Publishes the `@beacon/client` TypeScript package to npm.
#
# Release candidates: a pre-release tag (v2.0.0-rc.1) publishes under a matching npm dist-tag
# (`rc`) rather than `latest`, so `npm i @beacon/client` keeps resolving to the last stable
# release and RC users opt in with `npm i @beacon/client@rc`.

on:
  push:
    tags:
      # Covers stable (v1.8.0) and pre-release (v2.0.0-rc.1) tags alike.
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.8.0 or 2.0.0-rc.1. Empty = latest stable v* tag."
        required: false
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    working-directory: beacon-datalake-clients/beacon-ts

jobs:
  publish:
    name: Test, build, and publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@beacon/client
    permissions:
      contents: read
      id-token: write # provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, so we can find the latest tag

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then
            version="$REF_NAME"                          # the pushed release tag, e.g. v1.8.0
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"                     # from the manual input
          else
            # Latest *stable* tag. git's version sort has no SemVer pre-release semantics and ranks
            # v2.0.0-rc.1 above v2.0.0, so drop pre-releases here; to republish an RC by hand, name
            # it explicitly in the `version` input.
            tag=$(git tag --list 'v*' --sort=-v:refname | grep -vE '^v.*-' | head -n1)
            [ -n "$tag" ] || { echo "::error::No stable v* tags found; provide a version input."; exit 1; }
            version="$tag"                               # latest stable release tag
          fi
          version="${version#v}"                         # strip the leading 'v' -> X.Y.Z
          [ -n "$version" ] || { echo "::error::Could not resolve a version."; exit 1; }

          # npm dist-tag. `npm publish` with no --tag defaults to `latest`, which would make an RC
          # the default install for everyone. Derive the dist-tag from the SemVer pre-release
          # identifier instead: 2.0.0-rc.1 -> rc, 2.0.0-beta.2 -> beta, 1.8.0 -> latest.
          case "$version" in
            *-*)
              pre="${version#*-}"                        # 2.0.0-rc.1 -> rc.1
              pre="${pre%%.*}"                           # rc.1       -> rc
              pre="${pre%%[0-9]*}"                       # rc1        -> rc
              npm_tag="${pre:-next}"                     # numeric-only pre-release (2.0.0-1) -> next
              ;;
            *) npm_tag="latest" ;;
          esac

          echo "Resolved version: $version (npm dist-tag: $npm_tag)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"

      - name: Set package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
