name: Publish beacondb

# This workflow builds the `beacondb` wheels and publishes them to PyPI. A wheel holds the whole
# engine. It links netCDF, HDF5, OpenSSL and PROJ statically, so a machine needs no library.
# The release tag `v*` starts the workflow. The tag `v2.0.0-rc.1` publishes as 2.0.0rc1.

on:
  push:
    tags:
      # This pattern covers a stable tag (v1.8.0) and a pre-release tag (v2.0.0-rc.1).
      - "v*"
      # This tag releases beacondb alone, on a version line of its own.
      - "beacondb-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Expected version, cross-checked against the manifests. Empty = publish whatever they declare."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Build every wheel but skip publishing. Use this to exercise a build before tagging."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The committed manifests hold the version. The tag is a cross-check. This workflow writes no
  # version. A wrong tag stops the release. PyPI keeps a wrong version for ever, so the check
  # comes first. Set the version, commit, then tag.
  version:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version
        shell: bash
        env:
          # A tag push gives the version in the tag. A manual run gives it in the input.
          # An empty value makes no assertion. The workflow then publishes what the manifests hold.
          EXPECTED: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          python3 -m pip install --quiet --upgrade packaging
          python3 scripts/check-version.py "$EXPECTED"

  # One sdist covers every platform. A source distribution holds no platform tag, so PyPI keeps
  # one per version. pip uses it where a wheel is absent. That is Alpine today, and also
  # ppc64le, s390x and FreeBSD.
  sdist:
    name: Build sdist
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive # beacon-binary-format is a submodule, and ships in the sdist

      - name: Build sdist
        run: |
          python3 -m pip install --upgrade maturin twine
          maturin sdist --out dist --manifest-path beacon-db/beacon-db-py/Cargo.toml
          python3 -m twine check dist/*.tar.gz

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: beacondb-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build:
    name: Build wheel (${{ matrix.platform.key }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {
              key: manylinux-x86_64,
              runner: ubuntu-latest,
              target: x86_64,
              manylinux: "2_34",
            }
          - {
              key: manylinux-aarch64,
              runner: ubuntu-24.04-arm,
              target: aarch64,
              manylinux: "2_34",
            }
          - {
              key: macos-aarch64,
              runner: macos-15,
              target: aarch64,
              manylinux: "off",
            }
          - {
              key: windows-x64,
              runner: windows-latest,
              target: x64,
              manylinux: "off",
            }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive # beacon-binary-format is a submodule

      # The build needs protoc and cmake. It compiles netCDF, HDF5 and PROJ from source, so this
      # step installs none of the three. The build of PROJ also runs the `sqlite3` program, which
      # writes `proj.db`. macOS holds that program in /usr/bin. libsqlite3-sys gives the library.
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf cmake

      # Windows holds neither, and cannot use the bundled library. `proj-sys` gives cmake the name
      # `libsqlite3.a`, which MSVC never writes. So vcpkg gives SQLite, in the `static-md` triplet
      # that matches Rust on MSVC. The variables below name that copy to PROJ and to the crate.
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install -y protoc sqlite # cmake is preinstalled on the Windows runner
          vcpkg install sqlite3:x64-windows-static-md
          root=$(printf '%s' "${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}/installed/x64-windows-static-md" | tr '\\' '/')
          test -f "$root/lib/sqlite3.lib" || { echo "::error::vcpkg did not produce $root/lib/sqlite3.lib"; exit 1; }
          {
            echo "CMAKE_PREFIX_PATH=$root"
            echo "SQLITE3_INCLUDE_DIR=$root/include"
            echo "SQLITE3_LIB_DIR=$root/lib"
            echo "SQLITE3_STATIC=1"
          } >> "$GITHUB_ENV"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # The version is exact. The two compression flags below are recent. maturin rejects an
          # unknown flag only after a compile of 30 to 100 minutes.
          maturin-version: v1.14.1
          # The wheel is abi3, so one build covers CPython 3.10 and later. The three features put
          # netCDF, HDF5, OpenSSL and PROJ inside the wheel. `vendored-openssl` acts on Linux
          # alone. `release-wheel` is `release`, plus strip, thin LTO and one codegen unit.
          args: >-
            --profile release-wheel --out dist
            --manifest-path beacon-db/beacon-db-py/Cargo.toml
            --features static-netcdf,vendored-openssl,spatial-proj-bundled
            --compression-method deflated --compression-level 9
          manylinux: ${{ matrix.platform.manylinux }}
          # The container installs what the static build needs. Lance needs protoc and the
          # well-known types in `protobuf-devel`. netCDF, HDF5, OpenSSL and PROJ need cmake and a
          # compiler. OpenSSL needs perl with IPC::Cmd. PROJ needs sqlite3.
          before-script-linux: |
            set -eu
            # Write POSIX sh, not bash. The apk branch runs on Alpine, which holds no bash.
            # Alpine serves musllinux. Those entries are out of the matrix today. Keep the branch,
            # so that a return of musllinux needs no change here.
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache build-base cmake perl protobuf protobuf-dev linux-headers sqlite
            else
              dnf install -y protobuf-compiler protobuf-devel cmake perl perl-IPC-Cmd sqlite \
                || yum install -y protobuf-compiler protobuf-devel cmake perl perl-IPC-Cmd sqlite
            fi
            # Version 3.14.0 clears the floor of 3.12 by two minor versions. Only the base image
            # holds it there. Assert the version here. A new image otherwise fails later, with
            # "protoc failed: Unknown flag", inside a build script of Lance.
            echo "protoc: $(command -v protoc) -> $(protoc --version)"
            protoc_major=$(protoc --version | sed 's/^libprotoc //' | cut -d. -f1)
            protoc_minor=$(protoc --version | sed 's/^libprotoc //' | cut -d. -f2)
            if [ "$protoc_major" -eq 3 ] && [ "$protoc_minor" -lt 12 ]; then
              echo "error: protoc $(protoc --version) is too old; prost-build needs >= 3.12" >&2
              exit 1
            fi
            # protoc must find the well-known types on its default include path. The imports of
            # Lance fail without them. Test the path here. protoc reports nothing until a build
            # script gives it a .proto file that imports one.
            printf 'syntax = "proto3";\nimport "google/protobuf/empty.proto";\n' > /tmp/wkt.proto
            if ! protoc --descriptor_set_out=/dev/null -I /tmp /tmp/wkt.proto 2>/dev/null; then
              echo "error: protoc cannot resolve google/protobuf/empty.proto; install protobuf-devel/protobuf-dev" >&2
              exit 1
            fi
            rm -f /tmp/wkt.proto
            echo "protoc well-known types: ok"
            echo "cmake:  $(command -v cmake) -> $(cmake --version | head -n1)"
            # PROJ writes proj.db with the sqlite3 program, and stops without it. This step
            # installs no SQLite library. libsqlite3-sys compiles one and gives it to the cmake of
            # PROJ. That keeps `sqlite-devel` off the list above.
            if ! command -v sqlite3 >/dev/null 2>&1; then
              echo "error: sqlite3 is not installed; PROJ needs it to build proj.db" >&2
              exit 1
            fi
            echo "sqlite3: $(command -v sqlite3) -> $(sqlite3 --version | cut -d' ' -f1)"
            # The `vendored-openssl` feature compiles OpenSSL, so this step installs no
            # openssl-devel. The Configure script of OpenSSL needs IPC::Cmd from the list above.
            perl -MIPC::Cmd -e 'print "perl IPC::Cmd ok\n"'

      - name: Check metadata
        shell: bash
        run: |
          python3 -m pip install --upgrade twine
          python3 -m twine check dist/*.whl

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          # Each matrix entry holds a unique `key`. Two artifacts must not share a name. One
          # runner and target can build more than one wheel, as manylinux and musllinux did.
          name: beacondb-wheel-${{ matrix.platform.key }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build, sdist]
    # A dry run builds every wheel and the sdist. It stops before PyPI. A user can therefore run
    # the whole matrix on demand, and not only on a tag. No local container covers macOS or
    # Windows, so this run is the one test of those two.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/beacondb
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - name: Download all wheels and the sdist
        uses: actions/download-artifact@v4
        with:
          pattern: beacondb-* # beacondb-wheel-<key> plus beacondb-sdist
          path: dist
          merge-multiple: true

      - name: Verify sdist and wheels are present
        shell: bash
        working-directory: dist
        run: |
          ls -l
          sdists=$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)
          wheels=$(find . -maxdepth 1 -name '*.whl' | wc -l)
          echo "sdists=$sdists wheels=$wheels"
          [ "$sdists" -eq 1 ] || { echo "::error::Expected exactly 1 sdist, found $sdists. Source installs (Alpine/musl, ppc64le, s390x) depend on it."; exit 1; }
          [ "$wheels" -ge 1 ] || { echo "::error::No wheels found."; exit 1; }

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true # a re-run of the same tag shouldn't fail
