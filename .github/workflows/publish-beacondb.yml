name: Publish beacondb

# Builds the `beacondb` PyO3 wheels and publishes them to PyPI.
#
# `beacondb` embeds the whole beacon-db engine (DataFusion + Lance + netCDF/HDF5), so wheels are
# not pure Python. To produce **portable wheels on every platform — including Windows, which has
# no system package manager for these libraries — the build links netCDF and HDF5 statically**,
# compiling them from source via the `static-netcdf` cargo feature. That needs only two build
# tools present on every platform: `protoc` (Lance) and `cmake` (netcdf-src/hdf5-src). No system
# HDF5/netCDF packages are required. The wheel is abi3 (one wheel per platform covers CPython
# >= 3.10).
#
# Triggered by the workspace release tag `v*`, same as every other publish workflow — one tag
# releases the whole line. A `beacondb-v*` tag is still honoured for shipping a beacondb-only fix
# without cutting a full release; both forms resolve to the same version number.
#
# Release candidates: a pre-release tag (v2.0.0-rc.1) publishes as PyPI version 2.0.0rc1 — PyPI
# normalizes the SemVer suffix to PEP 440. No dist-tag equivalent is needed: pip ignores
# pre-releases unless asked, so `pip install beacondb` stays on the last stable release and RC users
# opt in with `pip install --pre beacondb`.

on:
  push:
    tags:
      # Covers stable (v1.8.0) and pre-release (v2.0.0-rc.1) tags alike.
      - "v*"
      # beacondb-only release, decoupled from the workspace version line.
      - "beacondb-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.8.0 or 2.0.0-rc.1. Empty = latest stable v* tag."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build wheel (${{ matrix.platform.key }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { key: manylinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          # Native aarch64 Linux runner — the static netCDF/HDF5 build compiles from source, so
          # QEMU emulation would be prohibitively slow. GitHub-hosted `ubuntu-*-arm` runners are
          # free for public repos; private repos must have ARM64 runners enabled.
          - { key: manylinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          # musllinux (Alpine) wheels are deliberately NOT built for now. manylinux wheels do not
          # install on musl, so on Alpine pip falls through to the sdist and builds from source,
          # which needs a Rust toolchain plus system HDF5/netCDF. Documented in
          # beacon-db/beacon-db-py/README.md and the 2.0.0-rc1 docs.
          # To restore: add the two musllinux_1_2 entries back here, and re-add the smoke-test
          # guard below (a musllinux wheel can't be installed on the glibc runner that builds it).
          - { key: macos-aarch64, runner: macos-14, target: aarch64, manylinux: "off" }
          - { key: macos-x86_64, runner: macos-13, target: x86_64, manylinux: "off" }
          - { key: windows-x64, runner: windows-latest, target: x64, manylinux: "off" }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, to resolve the version
          submodules: recursive # beacon-binary-format is a submodule

      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # Strips the optional beacondb- prefix, so both trigger forms land on the same version:
            #   v1.8.0          -> v1.8.0   (no-op)
            #   beacondb-v1.8.0 -> v1.8.0
            version="${REF_NAME#beacondb-}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            # Latest *stable* tag on the workspace release line. git's version sort has no SemVer
            # pre-release semantics and ranks v2.0.0-rc.1 above v2.0.0, so drop pre-releases here;
            # to republish an RC by hand, name it explicitly in the `version` input.
            tag=$(git tag --list 'v*' --sort=-v:refname | grep -vE '^v.*-' | head -n1)
            [ -n "$tag" ] || { echo "::error::No stable v* tags found; provide a version input."; exit 1; }
            version="$tag"                                  # latest stable release tag
          fi
          version="${version#v}"                            # v1.8.0 -> 1.8.0
          [ -n "$version" ] || { echo "::error::Could not resolve a version."; exit 1; }
          echo "Resolved version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set package + crate version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          v = os.environ["VERSION"]
          if not re.fullmatch(r"\d+\.\d+\.\d+([.\-+a-zA-Z0-9]*)?", v):
              raise SystemExit(f"Version '{v}' does not look valid")
          for path in ("beacon-db/beacon-db-py/pyproject.toml", "beacon-db/beacon-db-py/Cargo.toml"):
              p = pathlib.Path(path)
              text = p.read_text()
              new = re.sub(r'(?m)^version = "[^"]*"', f'version = "{v}"', text, count=1)
              if new == text:
                  raise SystemExit(f"No version line in {path}")
              p.write_text(new)
              print(f"set {path} -> {v}")
          PY

      # protoc + cmake are the only build tools needed (netCDF/HDF5 are compiled from source by
      # the static-netcdf feature). On Linux this happens inside the manylinux container via
      # `before-script-linux` below; here we provision macOS and Windows.
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf cmake

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install -y protoc # cmake is preinstalled on the Windows runner

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # abi3 wheel — no per-interpreter build needed. `static-netcdf` builds+links netCDF/HDF5
          # into the wheel so it is self-contained on every platform.
          args: >-
            --release --out dist
            --manifest-path beacon-db/beacon-db-py/Cargo.toml
            --features static-netcdf
          manylinux: ${{ matrix.platform.manylinux }}
          # Inside the build container, install only the toolchain the static build needs
          # (protoc for Lance, cmake + a C/C++ compiler + perl to build netCDF/HDF5 from source).
          # The manylinux container is AlmaLinux (dnf); the apk branch is kept so restoring the
          # musllinux entries (Alpine) needs no change here.
          before-script-linux: |
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache build-base cmake perl protobuf protobuf-dev linux-headers
            else
              dnf install -y protobuf-compiler cmake perl || yum install -y protobuf-compiler cmake perl
            fi

      # Every wheel currently built is installable on the runner that built it. If the musllinux
      # entries come back, this needs `if: ${{ !startsWith(matrix.platform.manylinux, 'musllinux') }}`
      # again — a musl wheel won't install on the glibc runner.
      - name: Smoke-test the wheel
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install dist/*.whl
          python3 -c "import beacondb; c=beacondb.connect(); print('beacondb', beacondb.__version__, c.sql('SELECT 1').fetchall())"

      - name: Check metadata
        shell: bash
        run: |
          python3 -m pip install --upgrade twine
          python3 -m twine check dist/*.whl

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          # `key` is unique per matrix entry, which matters once a single runner+target builds more
          # than one wheel (as manylinux + musllinux did) — artifact names must differ.
          name: beacondb-wheel-${{ matrix.platform.key }}
          path: dist/*.whl
          if-no-files-found: error

      # The sdist is platform-independent, so exactly one matrix entry builds it. It rides along
      # here rather than in its own job to reuse the checkout (submodules included) and the version
      # already stamped into pyproject.toml/Cargo.toml above — a separate job would have to repeat
      # both. maturin walks the path dependencies and emits a self-contained tree: the ~23 beacon-db
      # crates it needs, a trimmed workspace Cargo.toml, and Cargo.lock.
      - name: Build sdist
        if: matrix.platform.key == 'manylinux-x86_64'
        shell: bash
        run: |
          python3 -m pip install --upgrade maturin
          maturin sdist --out dist --manifest-path beacon-db/beacon-db-py/Cargo.toml
          python3 -m twine check dist/*.tar.gz

      - name: Upload sdist
        if: matrix.platform.key == 'manylinux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: beacondb-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/beacondb
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - name: Download all wheels and the sdist
        uses: actions/download-artifact@v4
        with:
          pattern: beacondb-* # beacondb-wheel-<key> plus beacondb-sdist
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true # a re-run of the same tag shouldn't fail
