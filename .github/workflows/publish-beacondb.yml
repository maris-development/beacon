name: Publish beacondb

# Builds the `beacondb` PyO3 wheels and publishes them to PyPI.
#
# `beacondb` embeds the whole beacon-db engine (DataFusion + Lance + netCDF/HDF5), so wheels are
# not pure Python. To produce **portable wheels on every platform — including Windows, which has
# no system package manager for these libraries — the build links netCDF and HDF5 statically**,
# compiling them from source via the `static-netcdf` cargo feature. That needs only two build
# tools present on every platform: `protoc` (Lance) and `cmake` (netcdf-src/hdf5-src). No system
# HDF5/netCDF packages are required. The wheel is abi3 (one wheel per platform covers CPython
# >= 3.10).
#
# Triggered by a `beacondb-v*` tag (distinct from the workspace's own `v*` release tag) or
# manually.

on:
  push:
    tags:
      - "beacondb-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.8.0. Empty = latest beacondb-v* tag."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build wheel (${{ matrix.platform.target }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          # Native aarch64 Linux runner — the static netCDF/HDF5 build compiles from source, so
          # QEMU emulation would be prohibitively slow. GitHub-hosted `ubuntu-*-arm` runners are
          # free for public repos; private repos must have ARM64 runners enabled.
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          # musllinux (Alpine) — manylinux wheels do NOT install on musl, so Alpine/Docker users
          # need these separately. Built in an Alpine container (apk, not dnf); the from-source
          # static HDF5/netCDF build under musl is the part most likely to need a first-run fix.
          - { runner: ubuntu-latest, target: x86_64, manylinux: "musllinux_1_2" }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: "musllinux_1_2" }
          - { runner: macos-14, target: aarch64, manylinux: "off" }
          - { runner: macos-13, target: x86_64, manylinux: "off" }
          - { runner: windows-latest, target: x64, manylinux: "off" }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, to resolve the version
          submodules: recursive # beacon-binary-format is a submodule

      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then
            version="${REF_NAME#beacondb-}"                 # beacondb-v1.8.0 -> v1.8.0
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            tag=$(git tag --list 'beacondb-v*' --sort=-v:refname | head -n1)
            [ -n "$tag" ] || { echo "::error::No beacondb-v* tags found; provide a version input."; exit 1; }
            version="${tag#beacondb-}"
          fi
          version="${version#v}"                            # v1.8.0 -> 1.8.0
          [ -n "$version" ] || { echo "::error::Could not resolve a version."; exit 1; }
          echo "Resolved version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set package + crate version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          v = os.environ["VERSION"]
          if not re.fullmatch(r"\d+\.\d+\.\d+([.\-+a-zA-Z0-9]*)?", v):
              raise SystemExit(f"Version '{v}' does not look valid")
          for path in ("beacon-db/beacon-db-py/pyproject.toml", "beacon-db/beacon-db-py/Cargo.toml"):
              p = pathlib.Path(path)
              text = p.read_text()
              new = re.sub(r'(?m)^version = "[^"]*"', f'version = "{v}"', text, count=1)
              if new == text:
                  raise SystemExit(f"No version line in {path}")
              p.write_text(new)
              print(f"set {path} -> {v}")
          PY

      # protoc + cmake are the only build tools needed (netCDF/HDF5 are compiled from source by
      # the static-netcdf feature). On Linux this happens inside the manylinux container via
      # `before-script-linux` below; here we provision macOS and Windows.
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf cmake

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install -y protoc # cmake is preinstalled on the Windows runner

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # abi3 wheel — no per-interpreter build needed. `static-netcdf` builds+links netCDF/HDF5
          # into the wheel so it is self-contained on every platform.
          args: >-
            --release --out dist
            --manifest-path beacon-db/beacon-db-py/Cargo.toml
            --features static-netcdf
          manylinux: ${{ matrix.platform.manylinux }}
          # Inside the build container, install only the toolchain the static build needs
          # (protoc for Lance, cmake + a C/C++ compiler + perl to build netCDF/HDF5 from source).
          # The container differs by target: manylinux is AlmaLinux (dnf), musllinux is Alpine
          # (apk) — so detect the package manager rather than assume one.
          before-script-linux: |
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache build-base cmake perl protobuf protobuf-dev linux-headers
            else
              dnf install -y protobuf-compiler cmake perl || yum install -y protobuf-compiler cmake perl
            fi

      # A musllinux wheel can't be installed on the glibc runner, so its smoke-test is skipped
      # (it would need an Alpine container); the metadata check below still runs for every wheel.
      - name: Smoke-test the wheel
        if: ${{ !startsWith(matrix.platform.manylinux, 'musllinux') }}
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install dist/*.whl
          python3 -c "import beacondb; c=beacondb.connect(); print('beacondb', beacondb.__version__, c.sql('SELECT 1').fetchall())"

      - name: Check metadata
        shell: bash
        run: |
          python3 -m pip install --upgrade twine
          python3 -m twine check dist/*.whl

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          # Include the libc tag: the same runner+target builds both a manylinux and a musllinux
          # wheel, so the artifact names must differ.
          name: beacondb-wheel-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/beacondb
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: beacondb-wheel-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true # a re-run of the same tag shouldn't fail
